services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PARSER_DB_NAME:?PARSER_DB_NAME is required}
      POSTGRES_USER: ${PARSER_DB_USER:?PARSER_DB_USER is required}
      POSTGRES_PASSWORD: ${PARSER_DB_PASSWORD:?PARSER_DB_PASSWORD is required}
    ports:
      - "${PARSER_DB_PORT:?PARSER_DB_PORT is required}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}
    ports:
      - "${PGADMIN_PORT:?PGADMIN_PORT is required}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
