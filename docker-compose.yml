services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PARSER_DB_NAME:?PARSER_DB_NAME is required}
      POSTGRES_USER: ${PARSER_DB_USER:?PARSER_DB_USER is required}
      POSTGRES_PASSWORD: ${PARSER_DB_PASSWORD:?PARSER_DB_PASSWORD is required}
    # Только петля сервера: в локальную сеть база не выходит, а администратор
    # подключается к ней клиентом через SSH-туннель.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Значения подставляет Compose при чтении файла — те же, что и выше.
      # Внутрь контейнера переменные не передаются, поэтому и escaping не нужен.
      test:
        - CMD-SHELL
        - pg_isready -U ${PARSER_DB_USER} -d ${PARSER_DB_NAME}
      interval: 5s
      timeout: 5s
      retries: 12
    init: true
    restart: unless-stopped

  remote-api:
    build:
      context: .
    image: megamarket-api:latest
    env_file:
      - .env.remote
    environment:
      TMPDIR: /var/lib/megamarket/jobs
    # Миграции стартуют сразу, поэтому база должна быть готова принимать
    # подключения, а не просто существовать как контейнер.
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8001"
    command:
      - sh
      - -c
      - >-
        alembic -c /app/alembic.ini upgrade head &&
        exec uvicorn megamarket.api.remote_app:app
        --host 0.0.0.0 --port 8001
    volumes:
      - seller_jobs:/var/lib/megamarket/jobs
    init: true
    restart: unless-stopped

volumes:
  seller_jobs:
  pgdata:
